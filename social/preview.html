<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Deadline link preview artwork</title>
<style>
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400 700; src: url("../fonts/jetbrains-mono-latin.woff2") format("woff2"); }
* { box-sizing: border-box; }
html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
body { background: #111214; color: #ededee; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
.card { height: 100%; padding: 48px 64px 32px; border-top: 8px solid #eb5b68; }
.top { display: flex; align-items: center; justify-content: space-between; font: 17px "JetBrains Mono", monospace; color: #b3b6bd; }
.label { display: flex; align-items: center; gap: 19px; }
.mark { position: relative; display: flex; align-items: center; gap: 5px; width: 36px; height: 34px; }
.mark i { width: 6px; height: 27px; background: #eb5b68; transform: skew(-18deg); }
.mark i:nth-child(2) { height: 34px; }
.mark::after { content: ""; position: absolute; left: -5px; right: -1px; top: 16px; height: 4px; background: #111214; }
h1 { margin: 52px 0 0 -8px; font-size: 150px; line-height: 1.03; letter-spacing: -9px; font-weight: 700; }
h1 span { color: #eb5b68; }
.tagline { margin: 16px 0 42px; color: #b3b6bd; font-size: 31px; letter-spacing: -.6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); padding: 26px 0 28px; border-top: 1px solid #32363c; border-bottom: 1px solid #32363c; }
.stat { display: flex; align-items: center; gap: 20px; }
.stat + .stat { border-left: 1px solid #32363c; padding-left: 35px; }
.number { font-size: 53px; line-height: 1; font-weight: 600; letter-spacing: -2px; }
.caption { font: 17px/1.6 "JetBrains Mono", monospace; color: #b3b6bd; }
.footer { margin-top: 30px; display: flex; align-items: center; justify-content: space-between; font: 15px "JetBrains Mono", monospace; color: #b3b6bd; }
.footer span { color: #eb5b68; }
</style>
</head>
<body>
<main class="card">
  <div class="top"><div class="label"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>THE CODING BENCHMARK / V3.5</div><span>deadline.nnx.fyi</span></div>
  <h1>DEADLINE<span>.</span></h1>
  <p class="tagline">Every model meets its deadline.</p>
  <div class="stats">
    <div class="stat"><span class="number">27</span><span class="caption">public<br>coding tasks</span></div>
    <div class="stat"><span class="number">24</span><span class="caption">scored<br>privately</span></div>
    <div class="stat"><span class="number">100</span><span class="caption">points<br>on the line</span></div>
  </div>
  <div class="footer">PRIVATE TESTS <span>/</span> PARTIAL CREDIT <span>/</span> NO JUDGE MODEL</div>
</main>
</body>
</html>
