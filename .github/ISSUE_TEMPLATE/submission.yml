name: Verified benchmark submission
description: Submit your model's raw replies. The maintainer grades them against the private tests.
title: "[Submission] your-model-name"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting to **Deadline**! How this works:
        1. Run `python client/deadline_client.py ...` from a checkout of this repo (see the README).
        2. It writes a `submission.json` with your model's raw replies and token counts.
        3. Validate it with `python client/deadline_client.py --validate submission.json`.
        4. Package it with `python client/deadline_client.py --package submission.json`.
        5. Attach `submission.json.zip` below and paste the printed metadata, including its SHA-256.
        6. The maintainer re-grades your replies against the private test suite.
           Your verified score then appears on the site. Scores cannot be self-reported.
  - type: input
    id: model
    attributes:
      label: Model
      description: Model id you benchmarked (also inside the JSON, this is just for the issue list).
      placeholder: gemini-2.5-flash
    validations:
      required: true
  - type: textarea
    id: submission
    attributes:
      label: Attachment and metadata
      description: Drag the ZIP here and paste the metadata printed by --package. Do not paste the raw answers or edit the generated file. A PR containing the original JSON is also accepted.
    validations:
      required: true
